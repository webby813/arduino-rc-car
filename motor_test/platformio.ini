; Left-motor reverse diagnostic for the Uno.
; Sketch lives in src/main.cpp (standard PlatformIO layout).
;   pio run -d motor_test -t upload      # flash the diagnostic
;   pio device monitor -d motor_test     # watch FORWARD/REVERSE at 9600 baud
; The original bare smoke test is still motor_test.ino (Arduino IDE).

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
upload_port = /dev/cu.usbserial-120
monitor_port = /dev/cu.usbserial-120
