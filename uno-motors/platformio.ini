; Arduino Uno - L298N motor driver, controlled over serial by the ESP32-CAM.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
; Set to your Uno's port (same one, once it's back to being a normal Uno).
upload_port = /dev/cu.usbserial-120
monitor_port = /dev/cu.usbserial-120
