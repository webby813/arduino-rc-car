; ESP32-CAM (AI-Thinker) - video stream + Wi-Fi control
; Streams MJPEG video and forwards drive commands over UART to the Arduino Uno.

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

; Injects AP_SSID / AP_PASS from the repo-root .env (template: .env.dev)
extra_scripts = pre:load_env.py

; --- Upload / monitor ---
; When flashing: GPIO0 -> GND, then press RST when "Connecting..." appears.
; Set this to the port your Uno-bridge / FTDI shows up as.
upload_port = /dev/cu.usbserial-120
monitor_port = /dev/cu.usbserial-120
upload_speed = 115200
monitor_speed = 115200

; --- ESP32-CAM has PSRAM; enable it for full-res framebuffers ---
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
